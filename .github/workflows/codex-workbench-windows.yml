name: Codex Workbench Windows

on:
  push:
    paths:
      - .github/workflows/codex-workbench-windows.yml
      - automation/codex-workbench/**
  pull_request:
    paths:
      - .github/workflows/codex-workbench-windows.yml
      - automation/codex-workbench/**

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run workbench tests
        run: python -m unittest discover -s automation/codex-workbench/tests -v
